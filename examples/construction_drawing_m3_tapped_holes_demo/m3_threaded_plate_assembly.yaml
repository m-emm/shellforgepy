ShellforgepyBuilderVersion: "2026-03-27"

Description: M3 blind and through tapped-hole construction-drawing plate

Parameters: {}

Builder:
  Visualization:
    construction_drawings:
      - name: m3_threaded_plate_top
        view: top
        parts:
          - source: self
            artifact: leader
            name: m3_threaded_plate
        units: mm
        scale: 1.0
        precision: 2
        annotations:
          - id: plate_width
            operation: bounding_box_x_dimension
            target: m3_threaded_plate.leader
            placement:
              alignments:
                - alignment: STACK_FRONT
                  stack_gap: 8
          - id: plate_height
            operation: bounding_box_y_dimension
            target: m3_threaded_plate.leader
            placement:
              alignments:
                - alignment: STACK_RIGHT
                  stack_gap: 8
          - id: blind_m3_thread
            operation: circle_diameter
            target: m3_threaded_plate.cutters.m3_blind_left
            quantity: 2
            diameter_tolerance: "±0.05"
            thread_size: M3
            thread_tolerance_class: 6H
            depth: 6
            placement:
              alignments:
                - alignment: STACK_BACK
                  stack_gap: 8
                - alignment: EDGE_LEFT
          - id: through_m3_thread
            operation: circle_diameter
            target: m3_threaded_plate.cutters.m3_through_right
            quantity: 2
            thread_size: M3
            thread_tolerance_class: 6H
            through: true
            placement:
              alignments:
                - alignment: STACK_RIGHT
                  stack_gap: 8
                - alignment: EDGE_FRONT
        frame: technical
        sheet:
          format: A4
          orientation: landscape
          margin: 10
          border: true
          title_block:
            title: M3 Tapped Hole Demonstrator
            drawing_number: SFP-STAGE5-M3
            revision: A
            material: Aluminum
            units: mm
            scale: "1:1"
            source: m3_threaded_plate
        output: svg

Parts:
  M3ThreadedPlate:
    Type: Shellforgepy::Assembly
    Properties:
      Generator: examples.construction_drawing_m3_tapped_holes_demo.m3_threaded_plate_generator.create_m3_threaded_plate_assembly
      Properties: {}
