globals:
  # This is the design's public tuning surface. The values below feed several
  # assemblies; bridge_length is computed once instead of repeated by hand.
  base_length: 260
  base_depth: 170
  base_thickness: 10
  profile_size: 20
  upright_inset: 18
  upright_height: 145
  bridge_length:
    $expr:
      $sub: "${base_length} - 2 * ${upright_inset}"
  carriage_width: 48
  carriage_wall: 3
  carriage_clearance: 0.6
  carriage_x_offset: 42
  probe_radius: 7
  probe_length: 58

assemblies:
  # One assembly may expose named followers. The two mounting pads generated by
  # machine_base become semantic alignment anchors later in this file.
  - name: machine_base
    resource_file: machine_base.yaml
    parameters:
      length: !Ref base_length
      depth: !Ref base_depth
      thickness: !Ref base_thickness
      profile_size: !Ref profile_size
      upright_inset: !Ref upright_inset

  # The same resource describes both uprights. Only the assembly identity is
  # different, so there is no duplicated generator code.
  - name: left_upright
    resource_file: structural_member.yaml
    parameters:
      length: !Ref profile_size
      depth: !Ref profile_size
      height: !Ref upright_height

  - name: right_upright
    resource_file: structural_member.yaml
    parameters:
      length: !Ref profile_size
      depth: !Ref profile_size
      height: !Ref upright_height

  - name: bridge
    resource_file: structural_member.yaml
    parameters:
      length: !Ref bridge_length
      depth: !Ref profile_size
      height: !Ref profile_size

  # This is a real geometry dependency, not merely a build-order declaration:
  # the bridge STEP artifact is injected into the carriage generator.
  - name: tool_carriage
    resource_file: tool_carriage.yaml
    depends_on:
      - bridge
    inject_parts:
      bridge: bridge.leader
    parameters:
      carriage_width: !Ref carriage_width
      wall_thickness: !Ref carriage_wall
      running_clearance: !Ref carriage_clearance
      tool_plate_thickness: 5
      tool_plate_drop: 34

  - name: inspection_probe
    resource_file: inspection_probe.yaml
    parameters:
      radius: !Ref probe_radius
      length: !Ref probe_length
      tip_length: 12

  # A collection is a scene/product root. It does not generate another solid;
  # machine_demo.yaml selects and styles the artifacts produced above.
  - name: machine_demo
    resource_file: machine_demo.yaml
    depends_on:
      - machine_base
      - left_upright
      - right_upright
      - bridge
      - tool_carriage
      - inspection_probe

placement:
  alignments:
    # Place each upright from named mounting interfaces. No global XYZ
    # coordinates are needed here.
    - part: left_upright
      to: machine_base.followers.left_upright_pad
      alignment: CENTER
      axes: [0, 1]
    - part: left_upright
      to: machine_base.followers.left_upright_pad
      alignment: STACK_TOP

    - part: right_upright
      to: machine_base.followers.right_upright_pad
      alignment: CENTER
      axes: [0, 1]
    - part: right_upright
      to: machine_base.followers.right_upright_pad
      alignment: STACK_TOP

    # The bridge length came from a global expression. Semantic alignment puts
    # it across the uprights and keeps it centered over the base.
    - part: bridge
      to: machine_base
      alignment: CENTER
      axes: [0, 1]
    - part: bridge
      to: left_upright
      alignment: STACK_TOP

    # First build the probe/carriage tool unit in local coordinates.
    - part: inspection_probe
      to: tool_carriage.followers.tool_plate
      alignment: CENTER
      axes: [0, 1]
    - part: inspection_probe
      to: tool_carriage.followers.tool_plate
      alignment: STACK_BOTTOM
      stack_gap: -6

    # From this point on the probe and carriage move as one rigid unit.
    - rigid_group:
        - inspection_probe
      to: tool_carriage

    # Finally place that unit on the bridge and move it along X. Changing only
    # carriage_x_offset gives another valid machine pose.
    - part: tool_carriage
      to: bridge
      alignment: CENTER
      axes: [0, 1, 2]
      post_translation:
        - !Ref carriage_x_offset
        - 0
        - 0
